<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for you</title>
<style>
:root{--bg:#1b1740;--bg2:#2a2160;--ink:#f6f0ff;--pink:#ff7a8a;--gold:#ffe3a3;--mute:#b9b0e0;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
main{width:min(92vw,460px);text-align:center;padding:24px;position:relative}
h1{font-family:"Bradley Hand","Segoe Script","Kaiti SC",STKaiti,cursive;font-size:clamp(44px,12vw,68px);line-height:1.05;margin:0 0 12px;color:var(--gold);font-weight:700}
p{margin:0 0 28px;color:var(--mute);font-size:18px;line-height:1.5}
.row{display:flex;gap:16px;justify-content:center;align-items:center;min-height:90px}
button{font:700 18px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;transition:transform .15s}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#yes{background:var(--pink);color:#2b0b17;font-size:calc(18px + var(--grow,0) * 3px);padding:calc(14px + var(--grow,0) * 3px) calc(28px + var(--grow,0) * 6px)}
#yes:active{transform:scale(.96)}
#no{background:transparent;color:var(--mute);border:2px solid var(--mute)}
#no.run{position:fixed}
.hide{display:none!important}
.ticket{background:var(--ink);color:#2a2160;border-radius:20px;padding:26px 22px;text-align:left;position:relative;margin:0 0 24px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ticket::before,.ticket::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket h2{font-family:"Bradley Hand","Segoe Script","Kaiti SC",STKaiti,cursive;font-size:40px;margin:0 0 22px;color:#d6455a;line-height:1}
.ticket dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:18px}
.ticket dt{color:#7a70b8}.ticket dd{margin:0;font-weight:700}
#copy{background:var(--gold);color:#2b2160}
.heart{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.heart{display:none}}
</style>
</head>
<body>
<main>
  <section id="ask">
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="row">
      <button id="yes">Yes!</button>
      <button id="no">No</button>
    </div>
  </section>
  <section id="done" class="hide">
    <h1>It’s a date!</h1>
    <div class="ticket">
      <h2>One date, two people</h2>
      <dl>
        <dt>When</dt><dd id="when"></dd>
        <dt>Where</dt><dd id="where"></dd>
        <dt>Dress</dt><dd id="dress"></dd>
      </dl>
    </div>
    <button id="copy">Copy my reply</button>
    <p id="note" style="margin-top:14px;font-size:15px"></p>
  </section>
</main>
<script>
// ✏️ EDIT THESE
var CONFIG = {
  name: "you",
  question: "Will you go on a Pizza date with me?",
  sub: "I’ve been thinking about it all week.",
  when: "Friday, 12:00 ",
  where: "Italian resturant",
  dress: "Whatever makes you happy",
  reply: "Yes! I’ll see you Friday at 12:00. 💕"
};
var noLines = ["No","Are you sure?","Really sure?","Think again…","Pretty please?","Last chance!","You can’t say no 😄"];
var tries = 0;
var $ = function(id){return document.getElementById(id)};
$("title").textContent = "Hey " + CONFIG.name + ", " + CONFIG.question.charAt(0).toLowerCase() + CONFIG.question.slice(1);
$("sub").textContent = CONFIG.sub;
$("when").textContent = CONFIG.when;
$("where").textContent = CONFIG.where;
$("dress").textContent = CONFIG.dress;

function dodge(e){
  if(e) e.preventDefault();
  tries++;
  var b = $("no");
  b.textContent = noLines[Math.min(tries, noLines.length - 1)];
  b.classList.add("run");
  var w = window.innerWidth - b.offsetWidth - 20, h = window.innerHeight - b.offsetHeight - 20;
  b.style.left = (10 + Math.random() * Math.max(w, 0)) + "px";
  b.style.top = (10 + Math.random() * Math.max(h, 0)) + "px";
  $("yes").style.setProperty("--grow", Math.min(tries, 8));
}
$("no").addEventListener("pointerenter", dodge);
$("no").addEventListener("pointerdown", dodge);
$("no").addEventListener("click", function(e){e.preventDefault()});

function hearts(){
  var set = ["💗","💖","💕","✨","🌸"];
  for(var i = 0; i < 40; i++){
    var s = document.createElement("span");
    s.className = "heart";
    s.textContent = set[i % set.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (16 + Math.random() * 22) + "px";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(s);
    setTimeout(function(el){el.remove()}, 8000, s);
  }
}
$("yes").addEventListener("click", function(){
  $("no").classList.add("hide");
  $("ask").classList.add("hide");
  $("done").classList.remove("hide");
  hearts();
});
$("copy").addEventListener("click", function(){
  var msg = CONFIG.reply, note = $("note");
  function shown(){note.textContent = "Copied. Paste it into your chat to send your answer."}
  try{
    navigator.clipboard.writeText(msg).then(shown, function(){note.textContent = msg});
  }catch(err){note.textContent = msg}
});
</script>
</body>
</html>
